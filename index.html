<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flecha POS Pro</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1554/1554401.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/big.js/6.2.1/big.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; }
        
        .custom-shadow { box-shadow: 0 -1px 3px 0 rgba(0,0,0,0.05), 0 1px 2px 0 rgba(0,0,0,0.06); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Contenedor de deslizamiento frenado */
        #swipe-wrap {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
        }
        .swipe-page {
            min-width: 100vw;
            scroll-snap-align: start;
            /* Esta es la regla mágica que evita pasar de largo al deslizar rápido */
            scroll-snap-stop: always; 
            height: 100%;
            overflow-y: auto;
            padding-bottom: 20px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col">

    <!-- HEADER SUPERIOR FLOTANTE (Solo Tasa y Logo) -->
    <header class="bg-white z-50 border-b flex-shrink-0">
        <div class="flex items-center justify-between px-4 py-3">
            <div class="flex items-center gap-2 text-blue-600">
                <i data-lucide="zap" class="w-6 h-6 fill-current"></i>
                <span class="font-black text-lg tracking-tight">FLECHA</span>
            </div>
            <div class="w-40 relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-sm font-bold">Bs/</span>
                <input type="number" id="tasa" inputmode="decimal" oninput="updAll()" placeholder="0.00" 
                    class="w-full pl-10 pr-3 py-2 bg-slate-100 rounded-lg text-sm font-bold text-blue-600 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>
        </div>
    </header>

    <!-- ÁREA DESLIZABLE PRINCIPAL -->
    <main id="swipe-wrap" class="hide-scroll flex-1 bg-slate-50 relative">

        <!-- PANEL 0: CUENTA / CARRITO -->
        <section class="swipe-page flex flex-col p-4 relative">
            <div class="flex justify-between items-center mb-3 flex-shrink-0">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1">
                    <i data-lucide="receipt" class="w-4 h-4"></i> Despacho
                </h2>
                <button onclick="newSale()" class="text-red-500 text-xs font-bold flex items-center gap-1 hover:bg-red-50 px-2 py-1 rounded transition-colors">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> VACIAR
                </button>
            </div>
            
            <!-- Lista del Carrito -->
            <div id="cart-list" class="flex-1 overflow-y-auto space-y-2 pb-4 hide-scroll"></div>

            <!-- Total Fijo Abajo (Ya no tapa cosas, se acopla al final del contenedor) -->
            <div class="flex-shrink-0 bg-blue-600 rounded-xl p-4 text-white shadow-lg shadow-blue-200 border border-blue-500 mt-2">
                <div class="flex justify-between items-end">
                    <span class="text-blue-100 text-sm font-medium">A cobrar:</span>
                    <div class="text-right">
                        <div class="text-3xl font-bold leading-none">$<span id="t-usd">0.00</span></div>
                        <div class="text-blue-100 font-medium mt-1 uppercase text-xs tracking-widest">
                            Bs <span id="t-bs" class="text-lg text-white font-bold">0,00</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- PANEL 1: CATÁLOGO -->
        <section class="swipe-page p-4 flex flex-col gap-3">
            <!-- Buscador -->
            <div class="relative flex-shrink-0">
                <i data-lucide="search" class="absolute left-3 top-3.5 w-5 h-5 text-slate-400"></i>
                <input type="text" id="busc" oninput="renderCat()" placeholder="Buscar producto..." 
                    class="w-full pl-10 pr-10 py-3 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 shadow-sm transition-all">
                <button onclick="document.getElementById('busc').value=''; renderCat()" class="absolute right-3 top-3.5 text-slate-400 active:scale-90">
                    <i data-lucide="x-circle" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Filtros rápidos -->
            <div id="quick-filters" class="flex gap-2 overflow-x-auto hide-scroll pb-1 flex-shrink-0"></div>
            
            <!-- Lista de Productos -->
            <div id="product-list" class="flex-1 overflow-y-auto space-y-2 pb-2 hide-scroll"></div>
        </section>

        <!-- PANEL 2: GESTIÓN Y BACKUP -->
        <section class="swipe-page p-4 space-y-4">
            <!-- Formulario -->
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                <h3 id="form-title" class="font-bold text-slate-700 flex items-center gap-2 uppercase text-xs tracking-widest">
                    <i data-lucide="plus-circle" class="w-4 h-4 text-blue-500"></i> Nuevo Producto
                </h3>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="p-nom" placeholder="Nombre del producto" class="col-span-2 p-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-blue-500 font-medium">
                    <input type="number" id="p-pre" inputmode="decimal" placeholder="Precio $" class="p-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-blue-500 font-bold text-blue-600">
                    <input type="text" id="p-tag" placeholder="Ej: bebida, pan" class="p-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-blue-500 text-sm">
                </div>
                <div class="flex gap-2">
                    <button id="btn-save" onclick="saveProd()" class="flex-1 bg-blue-600 active:bg-blue-700 py-3 rounded-lg font-bold text-sm text-white shadow transition-transform active:scale-95 flex items-center justify-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i> GUARDAR
                    </button>
                    <button id="btn-cancel" onclick="clearForm()" class="hidden bg-slate-200 text-slate-600 px-4 rounded-lg font-bold active:bg-slate-300">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Backup -->
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <h3 class="font-bold text-slate-700 uppercase text-xs tracking-widest mb-3 flex items-center gap-2">
                    <i data-lucide="database" class="w-4 h-4 text-slate-400"></i> Base de Datos
                </h3>
                <div class="flex gap-3">
                    <button onclick="exportDB()" class="flex-1 bg-slate-50 border border-slate-200 text-slate-600 py-3 rounded-lg text-xs font-bold flex flex-col items-center gap-1 active:bg-slate-100">
                        <i data-lucide="download" class="w-5 h-5 text-blue-500"></i> Exportar
                    </button>
                    <button onclick="document.getElementById('file-input').click()" class="flex-1 bg-slate-50 border border-slate-200 text-slate-600 py-3 rounded-lg text-xs font-bold flex flex-col items-center gap-1 active:bg-slate-100">
                        <i data-lucide="upload" class="w-5 h-5 text-emerald-500"></i> Importar
                    </button>
                    <input type="file" id="file-input" accept=".json" class="hidden" onchange="importDB(event)">
                </div>
            </div>
        </section>

    </main>

    <!-- NAVEGACIÓN INFERIOR (Bottom Navigation Bar) -->
    <nav class="bg-white border-t custom-shadow flex-shrink-0 flex items-center justify-around pb-safe pt-1">
        <button onclick="navTo(0)" id="tab-0" class="flex flex-col items-center justify-center w-full py-2 text-slate-400 transition-colors relative">
            <i data-lucide="shopping-cart" class="w-6 h-6 mb-1"></i>
            <span class="text-[10px] font-bold uppercase tracking-wider">Cuenta</span>
            <!-- Puntito rojo del carrito -->
            <span id="cart-badge" class="hidden absolute top-1 right-[30%] bg-red-500 text-white text-[10px] font-bold w-4 h-4 rounded-full items-center justify-center border-2 border-white">0</span>
        </button>
        
        <button onclick="navTo(1)" id="tab-1" class="flex flex-col items-center justify-center w-full py-2 text-blue-600 transition-colors">
            <i data-lucide="package" class="w-6 h-6 mb-1"></i>
            <span class="text-[10px] font-bold uppercase tracking-wider">Catálogo</span>
        </button>
        
        <button onclick="navTo(2)" id="tab-2" class="flex flex-col items-center justify-center w-full py-2 text-slate-400 transition-colors">
            <i data-lucide="settings" class="w-6 h-6 mb-1"></i>
            <span class="text-[10px] font-bold uppercase tracking-wider">Gestión</span>
        </button>
    </nav>

    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

        let cat = JSON.parse(localStorage.getItem('catF')) || [];
        let cart =[];
        let editIdx = -1;
        const wrap = document.getElementById('swipe-wrap');

        function vib() { if (navigator.vibrate) navigator.vibrate(30); }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('tasa').value = localStorage.getItem('tasaF') || '';
            lucide.createIcons();
            renderCat();
            updateFilters();
            setTimeout(() => navTo(1), 100); // Inicia en catálogo
        });

        // Detectar en qué pestaña estamos y pintar los iconos de azul
        wrap.addEventListener('scroll', () => {
            const index = Math.round(wrap.scrollLeft / window.innerWidth);
            [0,1,2].forEach(i => {
                const tab = document.getElementById(`tab-${i}`);
                if (i === index) {
                    tab.classList.remove('text-slate-400');
                    tab.classList.add('text-blue-600');
                } else {
                    tab.classList.remove('text-blue-600');
                    tab.classList.add('text-slate-400');
                }
            });
        });

        function navTo(index) {
            vib();
            wrap.scrollTo({ left: window.innerWidth * index, behavior: 'smooth' });
        }

        function getTasa() { 
            try { return new Big(document.getElementById('tasa').value || 0); } 
            catch { return new Big(0); }
        }

        function updAll() {
            localStorage.setItem('tasaF', document.getElementById('tasa').value);
            renderCat();
            renderCart();
        }

        function updateFilters() {
            const fContainer = document.getElementById('quick-filters');
            const tags =[...new Set(cat.flatMap(p => p.t || []))];
            
            let html = `<button onclick="setFilter('')" class="px-3 py-1.5 bg-slate-200 text-slate-700 text-[11px] font-bold rounded-full whitespace-nowrap active:scale-95 transition-transform">Todo</button>`;
            tags.forEach(tag => {
                if(tag) html += `<button onclick="setFilter('${tag}')" class="px-3 py-1.5 bg-blue-100 text-blue-700 text-[11px] font-bold rounded-full whitespace-nowrap uppercase active:scale-95 transition-transform">${tag}</button>`;
            });
            fContainer.innerHTML = html;
        }

        function setFilter(tag) {
            vib();
            document.getElementById('busc').value = tag;
            renderCat();
        }

        function renderCat() {
            const list = document.getElementById('product-list');
            const f = document.getElementById('busc').value.toLowerCase();
            const tasa = getTasa();
            list.innerHTML = '';
            
            cat.forEach((p, i) => {
                const tagsStr = p.t ? p.t.join(' ') : '';
                if (!f || p.n.toLowerCase().includes(f) || tagsStr.toLowerCase().includes(f)) {
                    const priceBig = new Big(p.pre);
                    const bsPrice = tasa.gt(0) ? priceBig.times(tasa).toFixed(2) : "0.00";
                    
                    const div = document.createElement('div');
                    div.className = "bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between active:scale-[0.98] transition-transform cursor-pointer shadow-sm";
                    div.innerHTML = `
                        <div class="flex-1 pr-2" onclick="addCart(${i})">
                            <div class="font-bold text-slate-800 leading-tight">${p.n}</div>
                            <div class="text-[10px] font-bold text-slate-400 uppercase mt-1">${p.t ? p.t.join(' • ') : ''}</div>
                        </div>
                        <div class="text-right flex items-center gap-3">
                            <div onclick="addCart(${i})">
                                <div class="text-[17px] font-extrabold text-blue-600 leading-none">$${priceBig.toFixed(2)}</div>
                                <div class="text-[11px] font-bold text-emerald-500 mt-1">${bsPrice} Bs</div>
                            </div>
                            <div class="flex flex-col gap-3 pl-3 border-l border-slate-100">
                                <button onclick="event.stopPropagation(); editProd(${i})" class="text-slate-300 hover:text-orange-500 active:scale-90"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                <button onclick="event.stopPropagation(); delProd(${i})" class="text-slate-300 hover:text-red-500 active:scale-90"><i data-lucide="trash" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    `;
                    list.appendChild(div);
                }
            });
            lucide.createIcons();
        }

        function addCart(i) {
            vib();
            const p = cat[i];
            const ex = cart.find(x => x.n === p.n);
            if (ex) ex.c = new Big(ex.c).plus(1).toNumber();
            else cart.push({ ...p, c: 1 });
            renderCart();
            
            // Micro-flash visual para confirmar que se agregó sin mirar el carrito
            const navIcon = document.querySelector('#tab-0 i');
            navIcon.classList.add('text-emerald-500', 'scale-125');
            setTimeout(() => navIcon.classList.remove('text-emerald-500', 'scale-125'), 200);
        }

        function renderCart() {
            const l = document.getElementById('cart-list');
            const tasa = getTasa();
            l.innerHTML = '';
            let uTotal = new Big(0);
            let totalItems = 0;

            cart.forEach((p, i) => {
                totalItems += p.c;
                const subUsd = new Big(p.pre).times(p.c);
                const subBs = tasa.gt(0) ? subUsd.times(tasa) : new Big(0);
                uTotal = uTotal.plus(subUsd);
                
                const d = document.createElement('div');
                d.className = "bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between shadow-sm";
                d.innerHTML = `
                    <div class="flex items-center gap-3 flex-1">
                        <div class="bg-blue-100 text-blue-700 font-black px-2.5 py-1 rounded text-sm">${p.c}x</div>
                        <div class="font-bold text-slate-700 leading-tight">${p.n}</div>
                    </div>
                    <div class="text-right mx-3">
                        <div class="font-bold text-slate-800">$${subUsd.toFixed(2)}</div>
                        <div class="text-[10px] font-bold text-slate-400">${subBs.toFixed(2)} Bs</div>
                    </div>
                    <button onclick="rem(${i})" class="text-red-400 bg-red-50 p-2 rounded-lg active:scale-90 transition-transform"><i data-lucide="minus" class="w-4 h-4"></i></button>
                `;
                l.appendChild(d);
            });

            document.getElementById('t-usd').innerText = uTotal.toFixed(2);
            document.getElementById('t-bs').innerText = tasa.gt(0) ? uTotal.times(tasa).toNumber().toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : "0,00";
            
            const badge = document.getElementById('cart-badge');
            if(totalItems > 0) {
                badge.innerText = totalItems;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
            lucide.createIcons();
        }

        function rem(i) {
            vib();
            if (cart[i].c > 1) cart[i].c = new Big(cart[i].c).minus(1).toNumber();
            else cart.splice(i, 1);
            renderCart();
        }

        function newSale() { vib(); cart =[]; renderCart(); navTo(1); }

        function saveProd() {
            vib();
            const n = document.getElementById('p-nom').value.trim();
            const preVal = document.getElementById('p-pre').value;
            const t = document.getElementById('p-tag').value.split(',').map(x => x.trim()).filter(x => x);
            
            if (!n || !preVal) return alert("Falta nombre o precio");
            const pre = new Big(preVal).toNumber();

            if (editIdx > -1) cat[editIdx] = { n, pre, t };
            else cat.push({ n, pre, t });

            localStorage.setItem('catF', JSON.stringify(cat));
            clearForm();
            updateFilters();
            renderCat();
            navTo(1);
        }

        function editProd(i) {
            vib();
            editIdx = i;
            document.getElementById('p-nom').value = cat[i].n;
            document.getElementById('p-pre').value = cat[i].pre;
            document.getElementById('p-tag').value = cat[i].t ? cat[i].t.join(',') : '';
            document.getElementById('form-title').innerHTML = `<i data-lucide="edit-3" class="w-4 h-4 text-orange-500"></i> Editar Producto`;
            document.getElementById('btn-save').innerHTML = `<i data-lucide="refresh-cw" class="w-4 h-4"></i> ACTUALIZAR`;
            document.getElementById('btn-cancel').classList.remove('hidden');
            navTo(2);
            lucide.createIcons();
        }

        function clearForm() {
            editIdx = -1;
            document.getElementById('p-nom').value = ''; document.getElementById('p-pre').value = ''; document.getElementById('p-tag').value = '';
            document.getElementById('form-title').innerHTML = `<i data-lucide="plus-circle" class="w-4 h-4 text-blue-500"></i> Nuevo Producto`;
            document.getElementById('btn-save').innerHTML = `<i data-lucide="save" class="w-4 h-4"></i> GUARDAR`;
            document.getElementById('btn-cancel').classList.add('hidden');
            lucide.createIcons();
        }

        function delProd(i) {
            vib();
            if (confirm("¿Borrar del catálogo?")) { cat.splice(i, 1); localStorage.setItem('catF', JSON.stringify(cat)); updateFilters(); renderCat(); }
        }

        function exportDB() {
            const dataStr = JSON.stringify(cat, null, 2);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([dataStr], { type: "application/json" }));
            a.download = `flecha_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function importDB(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const imported = JSON.parse(ev.target.result);
                    if (Array.isArray(imported) && confirm("¿Sobrescribir todo el inventario?")) {
                        cat = imported; localStorage.setItem('catF', JSON.stringify(cat));
                        updateFilters(); renderCat(); navTo(1);
                    }
                } catch { alert("Archivo inválido"); }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
