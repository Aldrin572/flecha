<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flecha POS Pro</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1554/1554401.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/big.js/6.2.1/big.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .custom-shadow { box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06); }
        #product-list { max-height: 50vh; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <header class="bg-white border-b sticky top-0 z-50 px-4 py-3 custom-shadow">
        <div class="flex items-center justify-between gap-4 max-w-2xl mx-auto">
            <div class="flex items-center gap-2 text-blue-600">
                <i data-lucide="zap" class="w-6 h-6 fill-current"></i>
                <span class="font-bold text-lg tracking-tight">FLECHA</span>
            </div>
            <div class="flex-1 max-w-[180px]">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-sm">Bs/$</span>
                    <input type="number" id="tasa" oninput="updAll()" placeholder="0.00" 
                        class="w-full pl-12 pr-3 py-2 bg-slate-100 border-none rounded-lg text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none text-slate-700">
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-4">
        <!-- Carrito -->
        <section class="bg-white rounded-xl border border-slate-200 overflow-hidden custom-shadow">
            <div class="bg-slate-50 px-4 py-2 border-b flex justify-between items-center">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-2">
                    <i data-lucide="shopping-cart" class="w-4 h-4"></i> Cuenta Actual
                </h2>
                <button onclick="newSale()" class="text-red-500 text-xs font-bold flex items-center gap-1 hover:bg-red-50 px-2 py-1 rounded">
                    <i data-lucide="trash-2" class="w-3 h-3"></i> LIMPIAR
                </button>
            </div>
            <div id="cart-list" class="p-4 space-y-3 min-h-[60px]"></div>
            <div class="bg-blue-600 p-4 text-white">
                <div class="flex justify-between items-end">
                    <span class="text-blue-100 text-sm">Total a cobrar:</span>
                    <div class="text-right">
                        <div class="text-3xl font-bold leading-none">$<span id="t-usd">0.00</span></div>
                        <div class="text-blue-100 font-medium mt-1 uppercase text-xs tracking-widest">
                            Bs <span id="t-bs" class="text-lg text-white">0,00</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Buscador -->
        <section class="space-y-3">
            <div class="relative">
                <i data-lucide="search" class="absolute left-3 top-3 w-5 h-5 text-slate-400"></i>
                <input type="text" id="busc" oninput="renderCat()" placeholder="Buscar producto o etiqueta..." 
                    class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 custom-shadow">
            </div>
            <div id="product-list" class="space-y-2 overflow-y-auto pr-1"></div>
        </section>

        <!-- Formulario -->
        <section class="bg-white p-4 rounded-xl border border-slate-200 custom-shadow space-y-3">
            <h3 id="form-title" class="font-bold text-slate-700 flex items-center gap-2 uppercase text-xs tracking-widest">
                <i data-lucide="plus-circle" class="w-4 h-4 text-blue-500"></i> Nuevo Producto
            </h3>
            <div class="grid grid-cols-2 gap-3">
                <input type="text" id="p-nom" placeholder="Nombre" class="col-span-2 p-3 bg-slate-50 border rounded-lg outline-none focus:border-blue-500">
                <input type="number" id="p-pre" placeholder="Precio $" class="p-3 bg-slate-50 border rounded-lg outline-none focus:border-blue-500">
                <input type="text" id="p-tag" placeholder="Tags (comas)" class="p-3 bg-slate-50 border rounded-lg outline-none focus:border-blue-500">
            </div>
            <div class="flex gap-2">
                <!-- FIX AQUÍ: Se añadió text-white -->
                <button id="btn-save" onclick="saveProd()" class="flex-1 bg-blue-600 hover:bg-blue-700 py-3 rounded-lg font-bold text-sm text-white shadow-lg shadow-blue-200 transition-all">
                    GUARDAR PRODUCTO
                </button>
                <button id="btn-cancel" onclick="clearForm()" class="hidden bg-slate-200 text-slate-600 px-4 rounded-lg font-bold">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
        </section>

        <!-- Backup -->
        <section class="flex gap-3">
            <button onclick="exportDB()" class="flex-1 bg-white border border-slate-200 text-slate-600 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-2 uppercase tracking-tighter hover:bg-slate-50">
                <i data-lucide="download" class="w-4 h-4"></i> Exportar JSON
            </button>
            <button onclick="document.getElementById('file-input').click()" class="flex-1 bg-white border border-slate-200 text-slate-600 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-2 uppercase tracking-tighter hover:bg-slate-50">
                <i data-lucide="upload" class="w-4 h-4"></i> Importar JSON
            </button>
            <input type="file" id="file-input" accept=".json" class="hidden" onchange="importDB(event)">
        </section>
    </main>

    <script>
        // REGISTRO DE SERVICE WORKER PARA PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        let cat = JSON.parse(localStorage.getItem('catF')) || [];
        let cart = [];
        let editIdx = -1;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('tasa').value = localStorage.getItem('tasaF') || '';
            lucide.createIcons();
            renderCat();
        });

        function getTasa() { 
            try { return new Big(document.getElementById('tasa').value || 0); } 
            catch { return new Big(0); }
        }

        function updAll() {
            localStorage.setItem('tasaF', document.getElementById('tasa').value);
            renderCat();
            renderCart();
        }

        function renderCat() {
            const list = document.getElementById('product-list');
            const f = document.getElementById('busc').value.toLowerCase();
            const tasa = getTasa();
            list.innerHTML = '';
            
            cat.forEach((p, i) => {
                const tagsStr = p.t ? p.t.join(' ') : '';
                if (!f || p.n.toLowerCase().includes(f) || tagsStr.toLowerCase().includes(f)) {
                    const priceBig = new Big(p.pre);
                    const bsPrice = tasa.gt(0) ? priceBig.times(tasa).toFixed(2) : "0.00";
                    
                    const div = document.createElement('div');
                    div.className = "bg-white p-4 rounded-xl border border-slate-200 flex items-center justify-between active:scale-[0.98] transition-transform cursor-pointer";
                    div.innerHTML = `
                        <div class="flex-1" onclick="addCart(${i})">
                            <div class="font-bold text-slate-800">${p.n}</div>
                            <div class="flex flex-wrap gap-1 mt-1">
                                ${p.t ? p.t.map(t => `<span class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded uppercase font-bold">${t}</span>`).join('') : ''}
                            </div>
                        </div>
                        <div class="text-right flex items-center gap-4">
                            <div onclick="addCart(${i})">
                                <div class="text-lg font-bold text-blue-600">$${priceBig.toFixed(2)}</div>
                                <div class="text-xs font-bold text-emerald-500">${bsPrice} Bs</div>
                            </div>
                            <div class="flex flex-col gap-2 pl-4 border-l">
                                <button onclick="event.stopPropagation(); editProd(${i})" class="p-1 text-slate-400 hover:text-blue-500"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                <button onclick="event.stopPropagation(); delProd(${i})" class="p-1 text-slate-400 hover:text-red-500"><i data-lucide="trash" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    `;
                    list.appendChild(div);
                }
            });
            lucide.createIcons();
        }

        function saveProd() {
            const n = document.getElementById('p-nom').value.trim();
            const preVal = document.getElementById('p-pre').value;
            const t = document.getElementById('p-tag').value.split(',').map(x => x.trim()).filter(x => x);
            if (!n || !preVal) return alert("Complete nombre y precio");
            const pre = new Big(preVal).toNumber();
            if (editIdx > -1) cat[editIdx] = { n, pre, t };
            else cat.push({ n, pre, t });
            localStorage.setItem('catF', JSON.stringify(cat));
            clearForm();
            renderCat();
        }

        function editProd(i) {
            editIdx = i;
            document.getElementById('p-nom').value = cat[i].n;
            document.getElementById('p-pre').value = cat[i].pre;
            document.getElementById('p-tag').value = cat[i].t ? cat[i].t.join(',') : '';
            document.getElementById('form-title').innerHTML = `<i data-lucide="edit-3" class="w-4 h-4 text-orange-500"></i> Editando Producto`;
            document.getElementById('btn-save').innerText = "ACTUALIZAR CAMBIOS";
            document.getElementById('btn-cancel').classList.remove('hidden');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            lucide.createIcons();
        }

        function clearForm() {
            editIdx = -1;
            document.getElementById('p-nom').value = '';
            document.getElementById('p-pre').value = '';
            document.getElementById('p-tag').value = '';
            document.getElementById('form-title').innerHTML = `<i data-lucide="plus-circle" class="w-4 h-4 text-blue-500"></i> Nuevo Producto`;
            document.getElementById('btn-save').innerText = "GUARDAR PRODUCTO";
            document.getElementById('btn-cancel').classList.add('hidden');
            lucide.createIcons();
        }

        function addCart(i) {
            const p = cat[i];
            const ex = cart.find(x => x.n === p.n);
            if (ex) ex.c = new Big(ex.c).plus(1).toNumber();
            else cart.push({ ...p, c: 1 });
            renderCart();
        }

        function renderCart() {
            const l = document.getElementById('cart-list');
            const tasa = getTasa();
            l.innerHTML = '';
            let uTotal = new Big(0);
            cart.forEach((p, i) => {
                const subUsd = new Big(p.pre).times(p.c);
                const subBs = tasa.gt(0) ? subUsd.times(tasa) : new Big(0);
                uTotal = uTotal.plus(subUsd);
                const d = document.createElement('div');
                d.className = "flex items-center justify-between text-sm py-1 border-b border-slate-50 last:border-0";
                d.innerHTML = `
                    <div class="flex-1">
                        <span class="font-bold text-blue-600 bg-blue-50 px-1.5 rounded mr-2">${p.c}x</span>
                        <span class="text-slate-700 font-medium">${p.n}</span>
                    </div>
                    <div class="text-right mr-4">
                        <div class="font-bold text-slate-800">$${subUsd.toFixed(2)}</div>
                        <div class="text-[10px] font-bold text-slate-400">${subBs.toFixed(2)} Bs</div>
                    </div>
                    <button onclick="rem(${i})" class="text-slate-300 hover:text-red-500"><i data-lucide="x-circle" class="w-5 h-5"></i></button>
                `;
                l.appendChild(d);
            });
            document.getElementById('t-usd').innerText = uTotal.toFixed(2);
            document.getElementById('t-bs').innerText = tasa.gt(0) 
                ? uTotal.times(tasa).toNumber().toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2})
                : "0,00";
            lucide.createIcons();
        }

        function rem(i) {
            if (cart[i].c > 1) cart[i].c = new Big(cart[i].c).minus(1).toNumber();
            else cart.splice(i, 1);
            renderCart();
        }

        function delProd(i) {
            if (confirm("¿Eliminar definitivamente?")) {
                cat.splice(i, 1);
                localStorage.setItem('catF', JSON.stringify(cat));
                renderCat();
            }
        }

        function newSale() { cart = []; renderCart(); }

        function exportDB() {
            const dataStr = JSON.stringify(cat, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `inventario_flecha_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function importDB(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const imported = JSON.parse(ev.target.result);
                    if (Array.isArray(imported) && confirm("¿Reemplazar inventario?")) {
                        cat = imported;
                        localStorage.setItem('catF', JSON.stringify(cat));
                        renderCat();
                    }
                } catch { alert("Archivo inválido"); }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
